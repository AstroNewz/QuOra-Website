<svg width="100%" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>QuOra logo</title>
  <desc>A refined ring mark built from a teal classical arc and a violet quantum arc with a smooth diagonal tail forming a Q, beside the QuOra wordmark in Space Grotesk.</desc>
  <g transform="translate(140,100)">
    <path d="M 0 -48 A 48 48 0 1 1 -33.9 33.9" fill="none" stroke="#1B6E71" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M -33.9 33.9 A 48 48 0 0 1 0 -48" fill="none" stroke="#5B4B9E" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="24" y1="24" x2="46" y2="46" stroke="#14181D" stroke-width="5.5" stroke-linecap="round"/>
  </g>
  <text x="220" y="118" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="600" fill="#14181D" letter-spacing="-0.02em">QuOra</text>
</svg>
